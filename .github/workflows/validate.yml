name: Validate

on:
  pull_request:
    branches: [master]
  # Also runs on the merge commit so npm-publish.yml can consume this run's
  # `workflow_run` success instead of re-validating. Running validation here
  # (not in the publish workflow) means publish never ships a commit that
  # wasn't validated as-is, and validation is never duplicated.
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    # Push events (merge to master) always validate — that run is what gates
    # publishing. PR events only run when the PR's head branch lives in THIS
    # repo (which requires write access); PRs from forks have a different head
    # repo and skip the job. On the ephemeral GitHub-hosted runner below this
    # is a POLICY choice, not a runner-safety requirement (fork runs are
    # sandboxed and get no secrets) — drop the `if` to give fork PRs CI.
    #
    # We gate on head-repo identity rather than author_association because the
    # latter downgrades private org members to "CONTRIBUTOR" in the event
    # payload, which would wrongly skip our own team's PRs. head.repo is null
    # for deleted forks, so the comparison safely fails closed (skips).
    #
    # Dependabot PRs use in-repo branches, so they satisfy the head-repo check
    # and still RUN here (we want their test coverage) — but they are NOT
    # exempt from the version-bump gate below, so they fail until a human turns
    # the dependency update into a real, version-bumped release. That keeps
    # master from drifting out of sync with what's published to npm.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted: the org's self-hosted runner group does not accept jobs
    # from public repos (allows_public_repositories=false, on purpose — it
    # keeps fork PRs off the fleet), so `self-hosted` here could never be
    # scheduled. Nothing below depends on runner-local state.
    runs-on: ubuntu-latest
    steps:
      # Up-front checkout: required so the local composite actions
      # (./.github/actions/*) exist on the runner before they're referenced,
      # and gives the version-bump step the base branch to diff against.
      # The vendored actions live here (not in the private pncit/shared-actions)
      # because this repo is a PUBLIC fork that can't clone a private action.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Install the repo's Node (.nvmrc) before the toolchain check: the hosted
      # image's system Node is whatever Ubuntu ships, not necessarily ours.
      # validate-codebase below runs setup-node again; that's a cache hit.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Env check: fail fast if the Node/npm majors don't match what the repo
      # expects (NODE_MAJOR_VERSION / NPM_MAJOR_VERSION are pncit org-level
      # Actions variables). Also catches .nvmrc drifting from the org standard.
      - uses: ./.github/actions/verify-node-toolchain
        with:
          node-major-version: ${{ vars.NODE_MAJOR_VERSION }}
          npm-major-version: ${{ vars.NPM_MAJOR_VERSION }}

      # Version-bump gate: @pncit/node-quickbooks is a published library, so
      # every PR into master must bump package.json's version — no exceptions.
      # Dependabot PRs don't bump the package's own version, so they fail here
      # by design; a maintainer rolls the dependency update into a versioned
      # release (bumping the version) to land it. This prevents an unversioned
      # change from merging and desyncing master from the published npm package.
      - name: Verify version changed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          CUR=$(node -p "require('./package.json').version || ''")

          # Get the base branch (usually master)
          BASE_BRANCH="${GITHUB_BASE_REF:-master}"
          git fetch origin "$BASE_BRANCH:$BASE_BRANCH" || true

          if git rev-parse --verify "$BASE_BRANCH" >/dev/null 2>&1; then
            PREV=$(git show "$BASE_BRANCH:package.json" 2>/dev/null \
              | node -p "(() => { const s=require('fs').readFileSync(0,'utf8'); try { return JSON.parse(s).version || '' } catch { return '' } })()" \
              || true)
          else
            PREV=""
          fi

          if [ -z "$CUR" ]; then
            echo "::error::No version found in package.json"
            exit 1
          fi

          if [ -n "$PREV" ] && [ "$CUR" = "$PREV" ]; then
            echo "::error::package.json version unchanged ($PREV -> $CUR). Version must be bumped for PRs."
            exit 1
          fi

          if [ -z "$PREV" ]; then
            echo "Could not determine previous version, skipping version check"
          else
            echo "Version changed: $PREV -> $CUR ✓"
          fi

      # Codebase checks: npm ci + lint + typecheck + test. This action does its
      # own checkout + setup-node (node-version-file: .nvmrc) and matches the
      # @pncit scope / npmjs registry by default.
      - uses: ./.github/actions/validate-codebase
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
