name: Publish

# Consumes the Validate workflow's result instead of re-validating: publish
# only fires after a successful Validate run on master, and it ships the exact
# SHA that Validate ran against. A new push re-runs Validate (and thus a fresh
# publish); publish can never run without a successful validation for that
# commit.
#
# NOTE: `workflows:` below must match the Validate workflow's `name:` field.
on:
  workflow_run:
    workflows: ['Validate']
    types: [completed]
    branches: [master]
  # Manual recovery — e.g. re-publishing master after a transient registry error.
  # Skips the workflow_run gate; operator's call.
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

# Serialize publishes: a newer publish supersedes an in-progress older one.
concurrency:
  group: publish-node-quickbooks
  cancel-in-progress: true

jobs:
  publish:
    # Only on a successful Validate that ran on master via push, or a manual
    # dispatch. PR-branch Validate runs are filtered out here.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'master'
        && github.event.workflow_run.event == 'push')
    # GitHub-hosted: the org's self-hosted runner group does not accept jobs
    # from public repos, so `self-hosted` could never be scheduled here.
    # Auth is OIDC trusted publishing (id-token above), which works from
    # GitHub-hosted runners without any runner-local credentials.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the commit Validate ran against, not master's current HEAD, so
          # a commit landing between Validate's success and this trigger can't
          # ship unvalidated. Empty for workflow_dispatch → falls back to the
          # default ref.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          scope: '@pncit'
          cache: npm
          cache-dependency-path: |
            package-lock.json

      # Pinned: org standard is npm 12 (matches shared-actions validate-codebase). Bump deliberately.
      - name: Update npm
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: npm ci

      # Skip when this commit did not bump the version. `npm publish` over an
      # existing version is a hard E403, which turned every unbumped merge —
      # Dependabot's, and CI-only PRs now that the bump gate exempts them —
      # into a red publish run (runs 33714086138 and 33715159834, 2026-09-02).
      # Compared against HEAD^ in git rather than looked up on npm: the
      # package is `access: restricted`, and this repo has no NPM_TOKEN, so an
      # unauthenticated `npm view` reports 404 for every version — which is
      # exactly what the first attempt at this guard did (#20). Same rule the
      # private libraries apply via verify-version-bump's push-side output.
      # The checkout above is fetch-depth 2 for this comparison. A manual
      # dispatch always attempts the publish (that is what it is for).
      - name: Check if this commit bumped the version
        id: check
        shell: bash
        env:
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          read_version() {
            node -p "(() => { const s = require('fs').readFileSync(0, 'utf8'); try { return JSON.parse(s).version || '' } catch { return '' } })()"
          }
          CUR=$(node -p "require('./package.json').version")
          PREV=$(git show HEAD^:package.json 2>/dev/null | read_version || true)
          if [ "$DISPATCHED" != "true" ] && [ "$CUR" = "$PREV" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "::notice::version unchanged ($CUR) against HEAD^ — nothing to publish."
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PREV:-<none>} -> $CUR; publishing."
          fi

      # No build step: this package ships index.js / index.d.ts directly.
      - name: Publish to npm
        if: steps.check.outputs.bumped == 'true'
        run: npm publish
